name: Update power rankings

on:
  schedule:
    # Every day at 11:17 UTC (6:17 AM Eastern in winter, 7:17 AM in summer).
    # Monday night games are final by then, and daily runs pick up ESPN stat corrections.
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub Pages hosting. Set the repository variable PAGES to "off" to stop it (e.g. after moving to Netlify).
  build:
    if: ${{ vars.PAGES != 'off' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull the league from ESPN
        run: node scripts/fetch-league.mjs
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          OWNER_NAMES: ${{ vars.OWNER_NAMES }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ vars.PAGES != 'off' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Netlify hosting. Netlify rebuilds on every push by itself; this keeps the daily refresh going.
  # Does nothing until the NETLIFY_BUILD_HOOK secret is set.
  netlify:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask Netlify to rebuild with fresh ESPN data
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No NETLIFY_BUILD_HOOK secret set, skipping."; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=Daily+ESPN+refresh"
          echo "Netlify build triggered."
